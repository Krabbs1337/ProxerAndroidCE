buildscript { scriptHandler ->
    apply from: "${projectDir}/gradle/versions.gradle"
    apply from: "${projectDir}/gradle/repositories.gradle", to: scriptHandler

    dependencies {
        // AGP 9 ships built-in Kotlin support (embedded KGP). Pin the newer KGP explicitly
        // so the Kotlin version is 2.4.x instead of the embedded minimum.
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
    }
}

plugins {
    id "com.android.application"
    id "com.google.devtools.ksp"
    // Only used for Glide's Java annotation processor (it has no KSP support for the generated
    // GlideApp API). Room and Moshi use KSP above.
    id "com.android.legacy-kapt"

    id "com.mikepenz.aboutlibraries.plugin"

    id "io.github.ben-manes.versions"
    id "io.gitlab.arturbosch.detekt"
    id "org.jlleitschuh.gradle.ktlint"
}

apply from: "${projectDir}/gradle/utils.gradle"

android {
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        namespace "me.proxer.app"
        applicationId "me.proxer.app"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode appVersionMajor * 1000000 + appVersionMinor * 10000 + appVersionPatch * 100
        versionName "$appVersionMajor.$appVersionMinor.$appVersionPatch"

        vectorDrawables.useSupportLibrary true

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64", "x86"
        }
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        logRelease {
            kotlin.srcDirs = release.kotlin.srcDirs
            res.srcDirs = release.res.srcDirs
        }
    }

    compileOptions {
        sourceCompatibility javaVersion
        targetCompatibility javaVersion
        coreLibraryDesugaringEnabled true
    }

    signingConfigs {
        if (shouldSign()) {
            release {
                storeFile file(getFromSecrets("RELEASE_STORE_FILE"))
                storePassword getFromSecrets("RELEASE_STORE_PASSWORD")
                keyAlias getFromSecrets("RELEASE_KEY_ALIAS")
                keyPassword getFromSecrets("RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        if (!shouldSign() && !isCI()) {
            logger.warn("This build will not be signed because it is missing the keystore info. Please add " +
                    "values for \"RELEASE_STORE_FILE\", \"RELEASE_STORE_PASSWORD\", \"RELEASE_KEY_ALIAS\" and " +
                    "\"RELEASE_KEY_PASSWORD\" to your secrets.properties file if you want the apk to be signed.")
        }

        debug {
            versionNameSuffix = "-debug"
            buildConfigField "String", "PROXER_API_KEY", "\"${getFromSecrets("PROXER_API_KEY")}\""
            buildConfigField "boolean", "LOG", "Boolean.parseBoolean(\"true\")"
        }

        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "config/shrinker/shrinker-rules.pro"

            buildConfigField "String", "PROXER_API_KEY", "\"${getFromSecrets("PROXER_API_KEY")}\""
            buildConfigField "boolean", "LOG", "Boolean.parseBoolean(\"false\")"

            if (shouldSign()) {
                signingConfig signingConfigs.release
            }
        }

        logRelease {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "config/shrinker/shrinker-rules.pro"

            versionNameSuffix = "-logRelease-${getGitHash()}"
            buildConfigField "String", "PROXER_API_KEY", "\"${getFromSecrets("PROXER_API_KEY")}\""
            buildConfigField "boolean", "LOG", "Boolean.parseBoolean(\"true\")"

            if (shouldSign()) {
                signingConfig signingConfigs.release
            }
        }
    }

    lint {
        // TODO(ROADMAP Phase 9): re-enable strict lint and re-wire config/lint/lint.xml.
        // The lint shipped with AGP 9 reports many new issues on this codebase.
        abortOnError = false
        warningsAsErrors = false
        checkReleaseBuilds = false
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }

        resources {
            excludes += [
                    "META-INF/*.kotlin_module",
                    "META-INF/*.version",
                    "META-INF/rxkotlin.properties",
                    "META-INF/proguard/**",
                    "META-INF/README.md",
                    "META-INF/nanohttpd/**",
                    "kotlin/**",
                    "kotlinx/**",
                    "third_party/**",
                    "jsr305_annotations/**",
                    "error_prone/**",
                    "auto/**",
                    "build-data.properties",
                    "androidsupportmultidexversion.txt",
                    "play-services-*.properties"
            ]
        }
    }

    bundle {
        language {
            enableSplit = true
        }

        abi {
            enableSplit = true
        }
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def typeSuffix = variant.buildType == "debug" ? "-debug" :
                variant.buildType == "logRelease" ? "-logRelease-${getGitHash()}" : ""
        def suffix = variant.buildType == "release" ? "-release" : ""

        variant.outputs.forEach { output ->
            output.outputFileName.set("app-${android.defaultConfig.versionName}${typeSuffix}${suffix}.apk")
        }
    }
}

kotlin {
    compilerOptions {
        // TODO(ROADMAP Phase 9): re-enable allWarningsAsErrors.
        allWarningsAsErrors.set(false)
        // jvmTarget defaults to android.compileOptions.targetCompatibility (17).
        freeCompilerArgs.addAll(["-Xjsr305=strict", "-progressive"])
    }
}

apply from: "${projectDir}/gradle/repositories.gradle"
apply from: "${projectDir}/gradle/dependencies.gradle"

ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}

detekt {
    buildUponDefaultConfig = true

    config = files("$projectDir/config/detekt/detekt.yml")

    reports {
        xml.destination = file("$buildDir/reports/detekt/detekt.xml")
        html.destination = file("$buildDir/reports/detekt/detekt.html")
    }
}

ktlint {
    version.set(ktlintVersion)
    reporters {
        reporter org.jlleitschuh.gradle.ktlint.reporter.ReporterType.CHECKSTYLE
    }
}

tasks.named("dependencyUpdates").configure {
    rejectVersionIf {
        it.candidate.version.contains("alpha") ||
                it.candidate.version.contains("beta") ||
                it.candidate.version.toLowerCase().contains("rc")
    }
}
