repositories {
    google()

    mavenCentral {
        content {
            // Everything under com.github.* comes from jitpack, except the few that are
            // published to Maven Central under that group.
            excludeGroupByRegex "com\\.github\\.(?!bumptech|anrwatchdog).*"
        }
    }

    gradlePluginPortal()

    maven {
        url "https://jitpack.io"
        mavenContent { releasesOnly() }
        content { includeGroupByRegex "com\\.github.*" }
    }
}
